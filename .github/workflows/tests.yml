name: CPU validation
on: [push, pull_request, workflow_dispatch]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements/cpu-reference.txt
      - run: python -m pip install -e ".[test,dev]"
      - run: python -m pytest -q
      - run: python selfcheck.py
      - run: python reproduce/run_experiments.py --manifest reproduce/smoke-manifest.json --output outputs/smoke
      - run: python reproduce/paper.py analyze --output outputs/paper-analysis
      - run: python -m build
