<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FMM Workbench</title>
<script src="vendor/plotly.min.js"></script>
<style>
:root {
  color-scheme: light;
  --surface-1:#fcfcfb; --page:#f9f9f7;
  --ink-1:#0b0b0b; --ink-2:#52514e; --ink-3:#898781;
  --grid:#e1e0d9; --axis:#c3c2b7; --border:rgba(11,11,11,0.10);
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a;
  --good:#0ca30c; --critical:#d03b3b;
  --seq0:#cde2fb; --seq4:#0d366b; --bin0:#f0efec; --bin1:#184f95;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --surface-1:#1a1a19; --page:#0d0d0d;
    --ink-1:#ffffff; --ink-2:#c3c2b7; --ink-3:#898781;
    --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,0.10);
    --s1:#3987e5; --s2:#d95926; --s3:#199e70;
    --bin0:#383835; --bin1:#86b6ef;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin:0; background:var(--page); color:var(--ink-1);
  font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif; }
header { display:flex; align-items:baseline; gap:16px; padding:10px 18px;
  border-bottom:1px solid var(--border); background:var(--surface-1); }
header h1 { font-size:17px; margin:0; }
header .env { color:var(--ink-3); font-size:12px; flex:1; }
header .lang button { padding:2px 8px; font-size:12px; border-radius:4px; }
header .lang button.active { background:var(--s1); border-color:var(--s1); color:#fff; }
main { display:flex; align-items:flex-start; }
#panel { width:360px; flex:none; padding:12px 14px 40px; height:calc(100vh - 46px);
  overflow-y:auto; border-right:1px solid var(--border); background:var(--surface-1); }
#content { flex:1; padding:12px 18px 60px; height:calc(100vh - 46px); overflow-y:auto; }
fieldset { border:1px solid var(--border); border-radius:8px; margin:0 0 10px;
  padding:8px 10px; }
legend { font-weight:600; font-size:13px; padding:0 4px; }
.row { display:flex; gap:8px; margin:4px 0; align-items:center; flex-wrap:wrap; }
.row label { flex:none; width:118px; color:var(--ink-2); font-size:12.5px; }
.row input, .row select { flex:1; min-width:60px; padding:3px 6px;
  border:1px solid var(--axis); border-radius:5px; background:var(--page);
  color:var(--ink-1); font:inherit; font-variant-numeric:tabular-nums; }
.row input.narrow { max-width:70px; flex:none; }
.row.check { align-items:flex-start; }
.row.check input[type=checkbox] { width:auto; flex:none; margin:4px 8px 0 2px; }
.row.check label { width:auto; flex:1; color:var(--ink-1); font-size:12.5px; line-height:1.4; }
.row.select-inline label { width:auto; }
#traj_bar { display:flex; justify-content:flex-end; align-items:center; gap:8px; margin:6px 0 -4px; }
#xz_bar { display:flex; justify-content:flex-end; align-items:center; gap:8px; }
#xz_bar select, #traj_bar select { padding:2px 6px; font-size:12px; border:1px solid var(--axis); border-radius:5px; background:var(--page); color:var(--ink-1); }
.hint { color:var(--ink-3); font-size:11.5px; margin:2px 0 0; }
.hint.warn { color:var(--critical); }
button { padding:7px 14px; border:1px solid var(--axis); border-radius:6px;
  background:var(--surface-1); color:var(--ink-1); font:inherit; cursor:pointer; }
button.primary { background:var(--s1); border-color:var(--s1); color:#fff; font-weight:600; }
button:disabled { opacity:.5; cursor:default; }
#tabs { display:flex; gap:4px; border-bottom:1px solid var(--border);
  margin-bottom:12px; position:sticky; top:0; background:var(--page); z-index:5; }
#tabs button { border:none; border-bottom:2px solid transparent; border-radius:0;
  background:none; color:var(--ink-2); padding:8px 12px; }
#tabs button.active { color:var(--ink-1); border-bottom-color:var(--s1); font-weight:600; }
.tabpane { display:none; }
.tabpane.active { display:block; }
table.data { border-collapse:collapse; margin:8px 0; font-variant-numeric:tabular-nums; }
table.data th, table.data td { border-bottom:1px solid var(--grid); padding:4px 10px;
  text-align:right; font-size:13px; }
table.data th { color:var(--ink-2); font-weight:600; border-bottom:1px solid var(--axis); }
table.data td:first-child, table.data th:first-child { text-align:left; }
tr.hilite td { font-weight:700; color:var(--s1); }
.cards { display:flex; gap:12px; flex-wrap:wrap; margin:6px 0 14px; }
.card { background:var(--surface-1); border:1px solid var(--border); border-radius:10px;
  padding:10px 16px; min-width:150px; }
.card .k { color:var(--ink-3); font-size:12px; }
.card .v { font-size:24px; font-weight:700; margin-top:2px; }
.card .v small { font-size:13px; font-weight:400; color:var(--ink-2); }
.chart { background:var(--surface-1); border:1px solid var(--border); border-radius:10px;
  margin:10px 0; padding:4px; }
.chartrow { display:flex; gap:10px; flex-wrap:wrap; }
.chartrow .chart { flex:1 1 420px; min-width:380px; }
h3 { font-size:14px; margin:18px 0 4px; }
.status-running { color:var(--s2); font-weight:600; }
.status-done { color:var(--good); font-weight:600; }
.status-error, .status-cancelled { color:var(--critical); font-weight:600; }
#msg { color:var(--critical); white-space:pre-wrap; font-size:12.5px; }
a.runlink { color:var(--s1); cursor:pointer; text-decoration:underline; }
pre.err { background:var(--surface-1); border:1px solid var(--border); padding:8px;
  overflow:auto; font-size:12px; }
</style>
</head>
<body>
<header>
  <h1 data-i18n="h1"></h1>
  <span class="env" id="envline"></span>
  <span class="lang"><button type="button" data-lang="zh">中文</button> <button type="button" data-lang="en">English</button></span>
</header>
<main>
<div id="panel">
  <p class="hint warn" id="env_hint"></p>
  <fieldset><legend data-i18n="leg_incidence"></legend>
    <div class="row"><label data-i18n="lab_wavelength"></label><input id="wavelength_nm" type="number" value="660" step="1"></div>
    <div class="row"><label data-i18n="lab_theta"></label><input id="theta_deg" type="number" value="0" step="0.5">
      <label style="width:34px">φ (°)</label><input id="phi_deg" class="narrow" type="number" value="0" step="1"></div>
    <div class="row"><label data-i18n="lab_pol"></label><select id="polarization">
      <option value="x" selected data-i18n="opt_pol_x"></option><option value="y" data-i18n="opt_pol_y"></option>
      <option value="custom" data-i18n="opt_pol_custom"></option></select></div>
    <div class="row" id="jones_row" hidden><label>Jones (jx, jy)</label>
      <input id="jx_re" class="narrow" type="number" value="1" step="0.1"><input id="jx_im" class="narrow" type="number" value="0" step="0.1">
      <input id="jy_re" class="narrow" type="number" value="0" step="0.1"><input id="jy_im" class="narrow" type="number" value="0" step="0.1"></div>
    <div class="row"><label data-i18n="lab_n_inc"></label><input id="n_incident" type="number" value="1.46" step="0.01"></div>
    <div class="row"><label data-i18n="lab_n_out"></label><input id="n_output" type="number" value="1.0" step="0.01"></div>
  </fieldset>
  <fieldset><legend data-i18n="leg_materials"></legend>
    <div class="row"><label data-i18n="lab_n_feat"></label><input id="n_feature" type="number" value="3.2" step="0.01"></div>
    <div class="row"><label data-i18n="lab_n_bg"></label><input id="n_background" type="number" value="1.0" step="0.01"></div>
    <div class="row"><label data-i18n="lab_thick"></label><input id="thickness_nm" type="number" value="800" step="10"></div>
  </fieldset>
  <fieldset><legend data-i18n="leg_period"></legend>
    <div class="row"><label data-i18n="lab_lx"></label><input id="lx_nm" type="number" value="2400" step="10"></div>
    <div class="row"><label data-i18n="lab_ly"></label><input id="ly_nm" type="number" value="700" step="10"></div>
    <div class="row"><label data-i18n="lab_grid"></label><input id="nx" class="narrow" type="number" value="480" step="1">
      <input id="ny" class="narrow" type="number" value="140" step="1"></div>
    <p class="hint" id="pixel_hint"></p>
  </fieldset>
  <fieldset><legend data-i18n="leg_orders"></legend>
    <div class="row"><label data-i18n="lab_descent"></label><input id="mx" class="narrow" type="number" value="16" step="1">
      <input id="my" class="narrow" type="number" value="4" step="1"></div>
    <div class="row"><label data-i18n="lab_gate"></label><input id="gx" class="narrow" type="number" value="32" step="1">
      <input id="gy" class="narrow" type="number" value="8" step="1"></div>
    <div class="row"><label data-i18n="lab_ladder"></label><input id="levels_certify" value="40,10; 48,12" data-i18n-title="title_ladder"></div>
    <div class="row"><label></label>
      <button type="button" id="btn_rule" style="padding:3px 10px;font-size:12px" data-i18n="btn_rule"></button>
      <button type="button" id="btn_ladder" style="padding:3px 10px;font-size:12px" data-i18n="btn_ladder"></button></div>
    <p class="hint" id="rule_hint"></p>
    <div class="row"><label data-i18n="lab_target"></label><input id="tm" class="narrow" type="number" value="3" step="1">
      <input id="tn" class="narrow" type="number" value="0" step="1"></div>
    <p class="hint" id="order_hint"></p>
  </fieldset>
  <fieldset><legend data-i18n="leg_fab"></legend>
    <div class="row"><label data-i18n="lab_filter"></label><input id="filter_nm" type="number" value="60" step="5"></div>
    <div class="row"><label data-i18n="lab_threshold"></label><input id="threshold" type="number" value="0.5" step="0.05"></div>
    <div class="row"><label data-i18n="lab_sym"></label><select id="symmetry">
      <option value="y" selected data-i18n="opt_sym_y"></option><option value="x" data-i18n="opt_sym_x"></option>
      <option value="xy">x + y</option><option value="none" data-i18n="opt_sym_none"></option></select></div>
    <div class="row"><label data-i18n="lab_cd"></label><input id="cd_bias_nm" value="-20, 20" data-i18n-title="title_cd"></div>
  </fieldset>
  <fieldset><legend data-i18n="leg_protocol"></legend>
    <div class="row"><label data-i18n="lab_protocol"></label><select id="protocol">
      <option value="guarded_mixed" selected data-i18n="opt_proto_gm"></option>
      <option value="legacy_chain" data-i18n="opt_proto_legacy"></option></select></div>
    <div id="gm_opts">
      <div class="row"><label data-i18n="lab_gm_ramp"></label><input id="gm_beta0" class="narrow" type="number" value="2" step="1" data-i18n-title="title_gm_ramp">
        <input id="gm_beta_end" class="narrow" type="number" value="2000" step="100" data-i18n-title="title_gm_ramp"></div>
      <div class="row"><label data-i18n="lab_gm_mix"></label><input id="gm_mix_k" class="narrow" type="number" value="4" step="1" data-i18n-title="title_gm_mix_k">
        <input id="gm_mix_from_beta" class="narrow" type="number" value="16" step="1" data-i18n-title="title_gm_mix_beta"></div>
      <div class="row check"><input id="gm_guards" type="checkbox" checked><label for="gm_guards" data-i18n="lab_gm_guards"></label></div>
      <div class="row check"><input id="gm_cadence" type="checkbox"><label for="gm_cadence" data-i18n="lab_gm_cadence"></label></div>
      <div class="row check"><input id="gm_rise" type="checkbox"><label for="gm_rise" data-i18n="lab_gm_rise"></label></div>
      <div class="row check"><input id="repair_enabled" type="checkbox"><label for="repair_enabled" data-i18n="lab_repair"></label></div>
      <div id="repair_opts" hidden>
        <div class="row"><label data-i18n="lab_repair_trigger"></label><select id="repair_trigger">
          <option value="manual" selected data-i18n="opt_trig_manual"></option>
          <option value="always" data-i18n="opt_trig_always"></option>
          <option value="numeric" data-i18n="opt_trig_numeric"></option></select></div>
        <div class="row" id="repair_numeric_row" hidden><label data-i18n="lab_repair_bar"></label><input id="repair_bar" class="narrow" type="number" step="0.01" placeholder="—" data-i18n-title="title_repair_bar">
          <input id="repair_optimism_max" class="narrow" type="number" value="0.05" step="0.01" data-i18n-title="title_repair_opt"></div>
        <div class="row"><label data-i18n="lab_repair_beta"></label><select id="repair_beta_mode">
          <option value="fixed" selected data-i18n="opt_beta_fixed"></option>
          <option value="star" data-i18n="opt_beta_star"></option></select>
          <input id="repair_beta_fixed" class="narrow" type="number" value="64" step="8"></div>
        <div class="row"><label data-i18n="lab_hops"></label><input id="repair_hops" class="narrow" type="number" value="15" step="1">
          <input id="repair_stop_after" class="narrow" type="number" value="12" step="1" data-i18n-title="title_stop_after"></div>
        <div class="row"><label data-i18n="lab_alphas"></label><input id="chain_alphas" value="0.1, 0.25, 0.5" data-i18n-title="title_alphas"></div>
        <div class="row"><label data-i18n="lab_redescent_k"></label><input id="chain_redescent_steps" class="narrow" type="number" value="30" step="5">
          <input id="repair_re_k" class="narrow" type="number" value="4" step="1"></div>
        <div class="row"><label data-i18n="lab_noise_seed"></label><input id="chain_noise_seed" type="number" value="9100" step="100" data-i18n-title="title_noise_seed"></div>
        <div class="row check"><input id="compare_restart_budget" type="checkbox"><label for="compare_restart_budget" data-i18n="lab_budget_cmp"></label></div>
      </div>
    </div>
    <div id="legacy_opts" hidden>
      <div class="row"><label data-i18n="lab_beta"></label><input id="beta_lo" class="narrow" type="number" value="1" step="1">
        <input id="beta_hi" class="narrow" type="number" value="64" step="1"></div>
      <div class="row"><label data-i18n="lab_ckpt"></label><input id="ckpt_every" type="number" value="50" step="1" data-i18n-title="title_ckpt"></div>
      <div class="row"><label data-i18n="lab_chain_start"></label><select id="chain_start_kind">
        <option value="restarts" selected data-i18n="opt_start_restarts"></option>
        <option value="seed" data-i18n="opt_start_seed"></option>
        <option value="run_best" data-i18n="opt_start_run"></option></select></div>
      <div class="row" id="chain_run_row" hidden><label data-i18n="lab_saved_run"></label><select id="chain_run"></select></div>
      <div class="row"><label data-i18n="lab_jumps"></label><input id="chain_jumps" type="number" value="40" step="5"></div>
      <div class="row"><label data-i18n="lab_noise_seed"></label><input id="lc_noise_seed" type="number" value="9100" step="100" data-i18n-title="title_noise_seed"></div>
      <div class="row"><label data-i18n="lab_alphas"></label><input id="lc_alphas" value="0.1, 0.25, 0.5" data-i18n-title="title_alphas"></div>
      <div class="row"><label data-i18n="lab_redescent"></label><input id="lc_redescent_steps" class="narrow" type="number" value="30" step="5">
        <input id="chain_beta" class="narrow" type="number" value="64" step="8"></div>
      <div class="row"><label data-i18n="lab_accept"></label><select id="accept_rule">
        <option value="nominal" selected data-i18n="opt_accept_nominal"></option>
        <option value="maximin_cd" data-i18n="opt_accept_maximin"></option></select></div>
      <div class="row check"><input id="lc_budget" type="checkbox" checked><label for="lc_budget" data-i18n="lab_budget_cmp"></label></div>
    </div>
  </fieldset>
  <fieldset><legend data-i18n="leg_optset"></legend>
    <div class="row"><label data-i18n="lab_steps"></label><input id="steps" type="number" value="219" step="1"></div>
    <div class="row"><label data-i18n="lab_seeds"></label><input id="seeds" value="2029, 2030, 2031" data-i18n-title="title_seeds"></div>
    <div class="row"><label data-i18n="lab_lr"></label><input id="lr0" type="number" value="0.02" step="0.005"></div>
  </fieldset>
  <fieldset><legend data-i18n="leg_engine"></legend>
    <div class="row"><label data-i18n="lab_engine"></label><select id="engine">
      <option value="gpu_c64" selected data-i18n="opt_engine_gpu"></option>
      <option value="cpu_c128" data-i18n="opt_engine_cpu"></option></select></div>
    <div class="row check"><input id="compare_torcwa" type="checkbox" checked><label for="compare_torcwa" data-i18n="lab_cmp_torcwa"></label></div>
    <div class="row check"><input id="compare_lumerical" type="checkbox"><label for="compare_lumerical" data-i18n="lab_cmp_lum"></label></div>
    <div class="row"><label data-i18n="lab_lum_k"></label><input id="lumerical_kvecs" value="201, 401" data-i18n-title="title_lum_k"></div>
    <div class="row check"><input id="memory_efficient" type="checkbox" checked><label for="memory_efficient" data-i18n="lab_me"></label></div>
    <div class="row"><label>save_on_cpu</label><select id="save_on_cpu">
      <option value="auto" selected data-i18n="opt_off_auto"></option><option value="on" data-i18n="opt_off_on"></option>
      <option value="off" data-i18n="opt_off_off"></option></select></div>
    <div class="row"><label data-i18n="lab_zmax"></label><input id="field_zin_nm" class="narrow" type="number" value="1000" step="100" data-i18n-title="title_zin">
      <input id="field_zmax_nm" class="narrow" type="number" value="2500" step="100" data-i18n-title="title_zmax"></div>
    <div class="row"><label data-i18n="lab_field_views"></label><span class="hint" style="flex:1" data-i18n="fv_always"></span></div>
    <div class="row check"><input id="fv_int_xz" type="checkbox"><label for="fv_int_xz" data-i18n="fv_int_xz"></label></div>
    <div class="row check"><input id="fv_phase_xz" type="checkbox"><label for="fv_phase_xz" data-i18n="fv_phase_xz"></label></div>
    <div class="row check"><input id="fv_xy_out" type="checkbox"><label for="fv_xy_out" data-i18n="fv_xy_out"></label></div>
    <div class="row check"><input id="fv_xy_layer" type="checkbox"><label for="fv_xy_layer" data-i18n="fv_xy_layer"></label></div>
  </fieldset>
  <fieldset><legend data-i18n="leg_source"></legend>
    <div class="row"><label data-i18n="lab_src"></label><select id="pattern_kind">
      <option value="seed" selected data-i18n="opt_src_seed"></option>
      <option value="uniform" data-i18n="opt_src_uniform"></option>
      <option value="run_best" data-i18n="opt_src_run"></option></select></div>
    <div class="row" id="src_seed_row"><label data-i18n="lab_src_seed"></label><input id="src_seed" type="number" value="2029"></div>
    <div class="row" id="src_fill_row" hidden><label data-i18n="lab_src_fill"></label><input id="src_fill" type="number" value="1" step="0.1"></div>
    <div class="row" id="src_run_row" hidden><label data-i18n="lab_saved_run"></label><select id="src_run"></select></div>
  </fieldset>
  <div class="row" style="gap:10px">
    <button class="primary" id="btn_optimize" data-i18n="btn_optimize"></button>
    <button id="btn_solve" data-i18n="btn_solve"></button>
  </div>
  <p id="msg"></p>
</div>
<div id="content">
  <div id="tabs">
    <button data-tab="jobs" class="active" data-i18n="tab_jobs"></button>
    <button data-tab="patterns" data-i18n="tab_patterns"></button>
    <button data-tab="fields" data-i18n="tab_fields"></button>
    <button data-tab="torcwa" data-i18n="tab_torcwa"></button>
    <button data-tab="summary" data-i18n="tab_summary"></button>
    <button data-tab="history" data-i18n="tab_history"></button>
  </div>
  <div class="tabpane active" id="tab-jobs">
    <div class="cards" id="job_cards"></div>
    <p class="hint" data-i18n-html="hint_traj"></p>
    <div id="traj_bar"><label for="traj_mode" data-i18n="lab_traj_mode"></label><select id="traj_mode">
      <option value="auto" selected data-i18n="traj_auto"></option><option value="all" data-i18n="traj_all"></option>
      <option value="current" data-i18n="traj_current"></option><option value="ckpt" data-i18n="traj_ckpt"></option></select></div>
    <div class="chart" id="traj_chart" style="height:360px"></div>
    <div class="chart" id="chain_chart" style="height:340px" hidden></div>
    <div class="chart" id="budget_chart" style="height:320px" hidden></div>
    <h3 data-i18n="h_joblist"></h3>
    <div id="job_list"></div>
    <pre class="err" id="job_error" hidden></pre>
  </div>
  <div class="tabpane" id="tab-patterns">
    <p class="hint" id="pat_hint"></p>
    <div id="patterns_container"></div>
  </div>
  <div class="tabpane" id="tab-fields">
    <div class="cards" id="field_cards"></div>
    <div class="chart" id="orders_bar" style="height:300px"></div>
    <h3 data-i18n="h_orders_table"></h3>
    <div id="orders_table"></div>
    <p class="hint" id="fields_note"></p>
    <div class="chart" id="field_xz_re" style="height:520px"></div>
    <div id="xz_bar" style="margin:6px 0 -4px" hidden><label for="xz_layer_mode" data-i18n="lab_xz_layer"></label><select id="xz_layer_mode">
      <option value="section" selected data-i18n="xzl_section"></option><option value="field" data-i18n="xzl_field"></option></select></div>
    <div class="chartrow">
      <div class="chart" id="field_xz_int" style="height:520px" hidden></div>
      <div class="chart" id="field_xz_phase" style="height:520px" hidden></div>
    </div>
    <div class="chartrow">
      <div class="chart" id="field_xy_int" style="height:300px" hidden></div>
      <div class="chart" id="field_xy_ph" style="height:300px" hidden></div>
    </div>

function ckptCount(steps) {
  const s = new Set([0, steps]);
  for (let t = 0.25; t < 0.6 - 1e-9; t += 0.25) s.add(Math.round(t * steps));
  for (let t = 0.6; t < 1 - 1e-9; t += 0.05) s.add(Math.round(t * steps));
  for (let k = 0; k <= steps; k += 12) s.add(k);
  return s.size;
}
function nTerms(l) { return (2 * l[0] + 1) * (2 * l[1] + 1); }
function updateHints() {
  const lx = +$('lx_nm').value, ly = +$('ly_nm').value;
  const nx = +$('nx').value, ny = +$('ny').value;
  const mx = +$('mx').value, my = +$('my').value;
  $('pixel_hint').textContent = t('pixel', { a: (lx / nx).toFixed(1), b: (ly / ny).toFixed(1) });
  const certs = parsePairs($('levels_certify').value);
  const gx = +$('gx').value, gy = +$('gy').value;
  const maxLv = certs.concat([[mx, my], [gx, gy]]).reduce((a, b) => nTerms(b) > nTerms(a) ? b : a, [mx, my]);
  const need = [4 * maxLv[0] + 1, 4 * maxLv[1] + 1];
  const ok = nx >= need[0] && ny >= need[1];
  const twoN = 2 * nTerms([mx, my]);
  $('order_hint').textContent = t('order_hint', { twoN, lv: maxLv, nx: need[0], ny: need[1] }) + (ok ? '' : t('order_bad'));
  $('order_hint').className = ok ? 'hint' : 'hint warn';
}

// Auto ladder: keep the descent aspect Mx/My, raise My one at a time, stop at
// the convolution limit of the current grid (nx >= 4Mx+1, ny >= 4My+1).
$('btn_ladder').addEventListener('click', () => {
  const nx = +$('nx').value, ny = +$('ny').value;
  const mx = +$('gx').value, my = +$('gy').value;      // rungs sit above the gate order, with its aspect ratio
  const maxMx = Math.floor((nx - 1) / 4), maxMy = Math.floor((ny - 1) / 4);
  const ladder = [];
  for (let k = my + 1; k <= maxMy; k++) {
    const mxk = Math.round(mx * k / my);
    if (mxk > maxMx) break;
    ladder.push(`${mxk},${k}`);
  }
  if (!ladder.length) { $('msg').textContent = t('ladder_none'); return; }
  $('levels_certify').value = ladder.join('; ');
  $('msg').textContent = '';
  updateHints();
});

async function api(path, opts) {

}
async function submit(kind) {

function startPolling() {
  if (state.pollTimer) clearInterval(state.pollTimer);
  state.pollTimer = setInterval(pollActive, 1000);
  pollActive();
}
async function pollActive() {
  await refreshJobList();
  if (!state.activeJob) return;
  try {
    const job = await api('/api/jobs/' + state.activeJob);
    renderJobProgress(job);
    if (job.status === 'done') {
      clearInterval(state.pollTimer); state.pollTimer = null;
      state.current = { params: job.params, result: job.result, trajectories: job.trajectories,
        checkpoints: job.checkpoints, chain_jumps: job.chain_jumps, run_id: job.run_id };
      renderAll(state.current);
      refreshRuns();
      switchTab(job.type === 'solve' ? 'fields' : 'summary');
    } else if (job.status === 'error' || job.status === 'cancelled') {
      clearInterval(state.pollTimer); state.pollTimer = null;
      $('job_error').hidden = !job.error;
      $('job_error').textContent = job.error || '';
    }
  } catch (e) { /* transient */ }
}
function statusLabel(s) { return `<span class="status-${s}">${t('st_' + s)}</span>`; }
async function refreshJobList() {
  try {
    const body = await api('/api/jobs');

      const dur = j.finished ? (j.finished - j.started).toFixed(1) + ' s'
        : (j.started ? ((Date.now() / 1000) - j.started).toFixed(0) + ' s…' : t('queued'));
      const cancel = (j.status === 'running' || j.status === 'queued')
        ? `<button onclick="cancelJob('${j.id}')">${t('btn_cancel')}</button>` : '';
      const view = j.status === 'done' ? `<a class="runlink" onclick="viewJob('${j.id}')">${t('btn_view')}</a>` : '';
      return `<tr><td>${j.id}</td><td>${t('type_' + j.type)}</td>

    }).join('');
    $('job_list').innerHTML = `<table class="data"><tr><th>${t('th_job')}</th><th>${t('th_type')}</th><th>${t('th_status')}</th><th>${t('th_time')}</th><th></th></tr>${rows}</table>`;

function renderJobProgress(job) {

  const cards = [];

  const lum = env.lumerical && env.lumerical.importable;
  $('envline').textContent =
    `python ${env.python || ''} · torch ${env.torch} · ${gpu} · TORCWA ${env.torcwa ? t('avail') : t('unavail')} · Lumerical ${lum ? t('avail') : t('unavail')} · ${env.threads} ${t('threads')}`;
  const notes = [];
  if (!env.cuda_available) notes.push(t('env_no_cuda'));
  if (!env.torcwa) notes.push(t('env_no_torcwa'));
  if (!lum) notes.push(t('env_no_lum', { err: (env.lumerical && env.lumerical.error) || '' }));
  $('env_hint').textContent = notes.join(' ');
  $('env_hint').hidden = !notes.length;
}
function applyEnv(env) {
  state.env = env;
  if (!env.cuda_available) {
    $('engine').value = 'cpu_c128';
    $('engine').querySelector('option[value="gpu_c64"]').disabled = true;
  }
  if (!env.torcwa) {
    $('compare_torcwa').checked = false; $('compare_torcwa').disabled = true;
  }
  if (!(env.lumerical && env.lumerical.importable)) {
    $('compare_lumerical').checked = false; $('compare_lumerical').disabled = true;
  }
  const optAuto = $('save_on_cpu').querySelector('option[value="auto"]');
  if (optAuto) optAuto.textContent = t('opt_off_auto', { n: env.offload_2n || 3000 });
  showEnv(env);
  updateHints();
}
async function loadEnv() {
  try { applyEnv(await api('/api/env')); }
  catch (e) { $('envline').textContent = t('backend_down'); }
}
applyLang(); loadEnv();
$('btn_rule').click();          // the panel opens with the order rule's tiers for the default problem
setInterval(refreshJobList, 5000);
</script>
</body>
</html>
